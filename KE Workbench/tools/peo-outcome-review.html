<style>
/* Layout: review workbench — sticky header with progress, filterable queue on the left, item under review on the right (context → my review → other reviewers → final decision) */
:root{
  --bg:#f4f6f7; --panel:#ffffff; --ink:#15191e; --ink-2:#48515b; --ink-3:#79828c; --rule:#dde1e5; --rule-2:#eceef1;
  --accent:#145f73; --accent-soft:#e3f0f3;
  --biz:#2a78d6; --cmp:#6250d6;
  --good:#0a7f3f; --good-soft:#e2f4e9; --warn:#a86a00; --warn-soft:#fdf1d8; --bad:#c13232; --bad-soft:#fbe5e5; --info:#2a6fb8; --info-soft:#e4eefb; --mute-soft:#eef0f2;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101316; --panel:#181c20; --ink:#eef1f4; --ink-2:#b4bcc5; --ink-3:#88919b; --rule:#2b3137; --rule-2:#22272c;
  --accent:#58b9cc; --accent-soft:#16343b; --biz:#3987e5; --cmp:#9085e9;
  --good:#4cc47f; --good-soft:#14301f; --warn:#e3a53a; --warn-soft:#33270f; --bad:#ec6b6b; --bad-soft:#3a1a1a; --info:#6ea8ea; --info-soft:#16283d; --mute-soft:#22272c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101316; --panel:#181c20; --ink:#eef1f4; --ink-2:#b4bcc5; --ink-3:#88919b; --rule:#2b3137; --rule-2:#22272c;
  --accent:#58b9cc; --accent-soft:#16343b; --biz:#3987e5; --cmp:#9085e9;
  --good:#4cc47f; --good-soft:#14301f; --warn:#e3a53a; --warn-soft:#33270f; --bad:#ec6b6b; --bad-soft:#3a1a1a; --info:#6ea8ea; --info-soft:#16283d; --mute-soft:#22272c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)} .small{font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{background:var(--panel);border-bottom:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
header.top .wrap{padding-block:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px;align-items:center}
.ttl{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.ttl h1{font-size:22px;font-weight:700}
.me{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.me img{width:24px;height:24px;border-radius:50%}
.rolepick{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.rolepick button{font:500 12.5px var(--f-body);background:transparent;color:var(--ink-2);border:0;padding:5px 10px;cursor:pointer}
.rolepick button+button{border-left:1px solid var(--rule)}
.rolepick button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.progress{grid-column:1/-1;display:grid;gap:6px}
.pbar{display:flex;height:10px;border-radius:3px;overflow:hidden;gap:2px;background:var(--rule-2)}
.pbar i{display:block;height:100%}
.plegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.plegend span{display:inline-flex;align-items:center;gap:6px}
.plegend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.notice{border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:10px 14px;font-size:13px}
main .wrap{display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px;padding-block:16px 60px;align-items:start}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;min-width:0}
/* queue */
.queue{position:sticky;top:132px;display:grid;grid-template-rows:auto minmax(0,1fr);max-height:calc(100vh - 150px)}
.filters{display:grid;gap:8px;padding:12px;border-bottom:1px solid var(--rule)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{font:500 12.5px var(--f-body);border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);border-radius:99px;padding:3px 10px;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
select,input[type=search],input[type=text],textarea{font:13px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
textarea{resize:vertical;line-height:1.45}
.list{overflow:auto;padding:4px 6px 8px}
.grp{font:600 11px var(--f-mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;padding:10px 8px 4px}
.it{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;width:100%;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;line-height:1.35}
.it:hover{background:var(--bg)}
.it:focus-visible{outline:2px solid var(--accent)}
.it[aria-current="true"]{background:var(--accent-soft)}
.it .id{font:11px var(--f-mono);color:var(--ink-3);padding-top:1px}
.it .tx{min-width:0}
.it .bd{grid-column:2;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.qcount{font:11px var(--f-mono);color:var(--ink-3);padding:6px 10px}
/* status pill */
.st{display:inline-flex;align-items:center;gap:4px;font:500 10.5px var(--f-mono);padding:1px 6px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.st.none{background:var(--mute-soft);color:var(--ink-2)}
.st.prog{background:var(--info-soft);color:var(--info)}
.st.ready{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.st.chg{background:var(--warn-soft);color:var(--warn)}
.st.rej{background:var(--bad-soft);color:var(--bad)}
.st.acc{background:var(--good);color:var(--panel)}
.st.drop{background:var(--ink-3);color:var(--panel)}
.dots{display:inline-flex;gap:3px;align-items:center;font:10.5px var(--f-mono);color:var(--ink-3)}
.dots b{display:inline-block;width:8px;height:8px;border-radius:50%}
.flagn{font:500 10.5px var(--f-mono);color:var(--bad)}
/* detail */
.detail{display:grid;gap:14px;min-width:0}
.panel{padding:18px;display:grid;gap:12px}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{font:500 13px var(--f-body);color:var(--accent);background:var(--panel);border:1px solid var(--rule);border-radius:6px;cursor:pointer;padding:6px 12px}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.stmt{font:600 22px/1.25 var(--f-display)}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.lbl{font:10.5px var(--f-mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 11px var(--f-mono);padding:2px 7px;border-radius:99px;border:1px solid var(--rule);white-space:nowrap;color:var(--ink);background:var(--panel)}
.svc{display:flex;flex-wrap:wrap;gap:4px 6px}
.svc span{font-size:11.5px;color:var(--ink-2);background:var(--bg);border-radius:4px;padding:2px 6px}
.sibs{display:grid;gap:4px;font-size:12.5px}
.sibs div{display:grid;grid-template-columns:44px 90px 1fr;gap:8px;padding:4px 6px;border-radius:4px}
.sibs div.cur{background:var(--accent-soft)}
.sibs .mono{color:var(--ink-3);font-size:11px}
.dl{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:13px}
.dl dt{font:10.5px var(--f-mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;padding-top:3px}
.dl dd{margin:0;color:var(--ink-2)}
.form{display:grid;gap:12px}
.field{display:grid;gap:5px}
.field > label,.field > .flabel{font:600 12.5px var(--f-body)}
.field .hint{font-size:12px;color:var(--ink-3)}
.verdicts{display:flex;flex-wrap:wrap;gap:6px}
.verdicts label,.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer;background:var(--panel)}
.verdicts input,.checks input{accent-color:var(--accent);margin:0}
.verdicts label:has(input:checked),.checks label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rolebox{border-left:3px solid var(--biz);padding-left:12px;display:grid;gap:12px}
.rolebox.cmp{border-left-color:var(--cmp)}
.saveline{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.saved{font-size:12.5px;color:var(--ink-3)}
.rv{display:grid;gap:8px;padding:12px;border:1px solid var(--rule-2);border-radius:8px}
.rvh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px}
.rvh img{width:22px;height:22px;border-radius:50%}
.rvh b{font-weight:600}
.role{font:500 10.5px var(--f-mono);padding:1px 6px;border-radius:4px;color:var(--panel)}
.role.business{background:var(--biz)} .role.compliance{background:var(--cmp)}
.rv .q{font-size:13px;background:var(--bg);border-radius:6px;padding:6px 10px}
.rv .c{font-size:13px;color:var(--ink-2);white-space:pre-wrap}
.decision{border:1px solid var(--accent);background:var(--accent-soft)}
.empty{font-size:13px;color:var(--ink-3)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}
.help{font-size:12.5px;color:var(--ink-2);display:grid;gap:4px}
.help summary{cursor:pointer;font-weight:500;color:var(--accent)}
@media (max-width:980px){main .wrap{grid-template-columns:minmax(0,1fr)}.queue{position:static;max-height:none}.list{max-height:360px}}
@media (max-width:640px){header.top{position:static}header.top .wrap{grid-template-columns:minmax(0,1fr)}.two,.frow{grid-template-columns:minmax(0,1fr)}.dl{grid-template-columns:minmax(0,1fr)}.sibs div{grid-template-columns:40px 1fr}.sibs div .s{display:none}}
</style>

function statusOf(id){
  const d=decisions[id];
  if(d&&d.status==='accepted') return 'acc';
  if(d&&d.status==='dropped') return 'drop';
  const rs=Object.entries(reviews[id]||{}).map(([u,r])=>r);
  if(!rs.length) return 'none';
  if(rs.some(r=>r.verdict==='reject')) return 'rej';
  if(rs.some(r=>r.verdict==='discuss')) return 'chg';
  const okB=rs.some(r=>r.role==='business'&&(r.verdict==='approve'||r.verdict==='edits'));
  const okC=rs.some(r=>r.role==='compliance'&&(r.verdict==='approve'||r.verdict==='edits'));
  if(okB&&okC) return rs.some(r=>r.verdict==='edits')?'chg':'ready';
  return 'prog';
}

function pass(i){
  if(i.type!==st.tab) return false;
  if(st.q && !(i.text.toLowerCase().includes(st.q)||i.id.toLowerCase()===st.q)) return false;
  if(st.status && statusOf(i.id)!==st.status) return false;
  if(st.theme && i.type==='outcome' && i.theme!==st.theme) return false;
  if(st.job && ((i.type==='outcome'&&i.job!==st.job)||(i.type==='job'&&i.id!==st.job))) return false;
  const mine=me.id&&(reviews[i.id]||{})[me.id];
  if(st.mine==='todo'&&mine) return false; if(st.mine==='done'&&!mine) return false;
  if(st.mine==='needs-biz'&&roleCount(i.id,'business')) return false;
  if(st.mine==='needs-cmp'&&roleCount(i.id,'compliance')) return false;
  if(st.mine==='flagged'&&!flagsOf(i.id).length) return false;
  return true;
}

  if(!me.canWrite) return `<div class="panel card"><h3>Your review</h3><p class="notice">You have view access only. Ask the owner for Contributor access to add reviews.</p></div>`;
  let r=(reviews[it.id]||{})[me.id]||{};
  try{const d=JSON.parse(localStorage.getItem(draftKey(it.id))||'null'); if(d) r={...r,...d,_draft:true};}catch(e){}
  const roleSel=me.role?'':`<div class="notice">Choose your review role at the top of the page (Business SME or Compliance SME) before saving.</div>`;
  const wordingLabel=it.type==='persona'?'Suggested changes to the profile':'Suggested wording';
  const biz=me.role==='business'?`<div class="rolebox"><div class="eyebrow" style="color:var(--biz)">Business review</div>
      ${it.type==='outcome'?`<div class="two"><div class="field"><label for="r-step">Job-map step</label><select id="r-step">${D.steps.map((s,i)=>`<option value="${s.id}" ${(r.step||OUT[it.id].step)===s.id?'selected':''}>${i+1} · ${s.name}</option>`).join('')}</select></div>
        <div class="field"><label for="r-theme">Theme</label><select id="r-theme">${D.themes.map(t=>`<option ${(r.theme||OUT[it.id].theme)===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div></div>`:''}
      <div class="field"><span class="flabel">Keep for the study?</span><div class="verdicts">${[['keep','Keep'],['merge','Merge with another'],['drop','Drop']].map(([k,l])=>`<label><input type="radio" name="r-keep" value="${k}" ${(r.keep||'keep')===k?'checked':''}>${l}</label>`).join('')}</div></div>
      <div class="field"><label for="r-merge">Duplicate of (IDs)</label><input type="text" id="r-merge" value="${esc(r.merge||'')}" placeholder="e.g. O014, O022"></div></div>`:'';
  const cmp=me.role==='compliance'?`<div class="rolebox cmp"><div class="eyebrow" style="color:var(--cmp)">Compliance review</div>
      <div class="field"><span class="flabel">Risk flags</span><div class="checks">${FLAGS.map(([k,l])=>`<label><input type="checkbox" name="r-flag" value="${k}" ${(r.flags||[]).includes(k)?'checked':''}>${l}</label>`).join('')}</div></div>
      <div class="field"><span class="flabel">Approved uses</span><span class="hint">Where this statement may be used once the study is fielded.</span><div class="checks">${USES.map(([k,l])=>`<label><input type="checkbox" name="r-use" value="${k}" ${(r.uses||(r.verdict?[]:['survey'])).includes(k)?'checked':''}>${l}</label>`).join('')}</div></div></div>`:'';
  return `<div class="panel card"><div class="navrow"><h3>Your review</h3>${r.at?`<span class="saved">${r._draft?'Unsaved draft · ':''}Last saved ${new Date(r.at).toLocaleString()}</span>`:r._draft?'<span class="saved">Unsaved draft</span>':''}</div>${roleSel}
    <form class="form" id="rform">
      <div class="field"><span class="flabel">Verdict</span><div class="verdicts">${VERDICTS.map(([k,l])=>`<label><input type="radio" name="r-v" value="${k}" ${r.verdict===k?'checked':''} required>${l}</label>`).join('')}</div></div>
      <div class="field"><label for="r-wording">${wordingLabel}</label><textarea id="r-wording" rows="2" placeholder="Leave blank if the current wording is right">${esc(r.wording||'')}</textarea></div>
      ${biz}${cmp}
      <div class="field"><label for="r-comment">Comment</label><textarea id="r-comment" rows="3" placeholder="Why, and anything the other reviewers should know">${esc(r.comment||'')}</textarea></div>
      <div class="saveline"><button class="btn primary" type="submit" ${me.role?'':'disabled'}>Save review</button><button class="btn" type="button" id="savenext" ${me.role?'':'disabled'}>Save and next</button><span class="saved" id="formmsg"></span></div>
    </form></div>`;
}
function othersBlock(it){
  const rs=Object.entries(reviews[it.id]||{}).filter(([u])=>u!==me.id);
  if(!rs.length) return `<div class="panel card"><h3>Other reviews</h3><p class="empty">No one else has reviewed this yet.</p></div>`;
  rs.sort((a,b)=>(b[1].at||0)-(a[1].at||0));
  return `<div class="panel card"><h3>Other reviews · ${rs.length}</h3>${rs.map(([u,r])=>{const p=names[u]||{};
    return `<div class="rv"><div class="rvh">${p.avatarUrl?`<img src="${esc(p.avatarUrl)}" alt="">`:''}<b class="nm" data-u="${esc(u)}"></b><span class="role ${r.role}">${ROLES[r.role]||'Reviewer'}</span>${vchip(r.verdict)}<span class="saved">${r.at?new Date(r.at).toLocaleString():''}</span></div>
      ${r.wording?`<div class="q"><span class="lbl">Suggested</span> ${esc(r.wording)}</div>`:''}
      ${r.role==='business'&&it.type==='outcome'&&(r.step&&r.step!==OUT[it.id].step||r.theme&&r.theme!==OUT[it.id].theme)?`<div class="meta">${r.step&&r.step!==OUT[it.id].step?`<span class="lbl">Move to step</span><span class="chip">${STEP[r.step].n} · ${STEP[r.step].name}</span>`:''}${r.theme&&r.theme!==OUT[it.id].theme?`<span class="lbl">Re-theme</span><span class="chip">${esc(r.theme)}</span>`:''}</div>`:''}
      ${r.keep&&r.keep!=='keep'?`<div class="meta"><span class="lbl">Study</span><span class="chip">${r.keep==='merge'?'Merge':'Drop'}</span>${r.merge?`<span>with ${esc(r.merge)}</span>`:''}</div>`:''}
      ${(r.flags||[]).length?`<div class="meta"><span class="lbl" style="color:var(--bad)">⚑ Flags</span>${r.flags.map(f=>`<span class="chip">${esc((FLAGS.find(x=>x[0]===f)||[f,f])[1])}</span>`).join('')}</div>`:''}
      ${r.role==='compliance'?`<div class="meta"><span class="lbl">Approved uses</span>${(r.uses||[]).length?r.uses.map(u=>`<span class="chip">${esc((USES.find(x=>x[0]===u)||[u,u])[1])}</span>`).join(''):'<span class="small">None</span>'}</div>`:''}
      ${r.comment?`<div class="c">${esc(r.comment)}</div>`:''}</div>`;}).join('')}</div>`;
}
function decisionBlock(it){
  const d=decisions[it.id];
  const usesAgreed=(()=>{const cr=Object.values(reviews[it.id]||{}).filter(r=>r.role==='compliance'); if(!cr.length) return []; return USES.map(u=>u[0]).filter(u=>cr.every(r=>(r.uses||[]).includes(u)));})();
  const view=d?`<div class="meta">${pill(d.status==='accepted'?'acc':d.status==='dropped'?'drop':'prog')}<span class="saved">by <b class="nm" data-u="${esc(d.by||'')}"></b> · ${d.at?new Date(d.at).toLocaleString():''}</span></div>${d.wording?`<div class="q" style="background:var(--panel);border-radius:6px;padding:6px 10px"><span class="lbl">Final wording</span> ${esc(d.wording)}</div>`:''}${(d.uses||[]).length?`<div class="meta"><span class="lbl">Approved uses</span>${d.uses.map(u=>`<span class="chip">${esc(USES.find(x=>x[0]===u)[1])}</span>`).join('')}</div>`:''}${d.note?`<div class="small muted">${esc(d.note)}</div>`:''}`:'<p class="empty">No final decision yet.</p>';
  if(!me.canDecide) return `<div class="panel card decision"><h3>Final decision</h3>${view}<p class="small muted">Editors record the final decision once business and compliance have both reviewed.</p></div>`;
  const cur=d||{};
  return `<div class="panel card decision"><h3>Final decision</h3>${view}
    <form class="form" id="dform">
      <div class="field"><span class="flabel">Decision</span><div class="verdicts">${[['accepted','Accept'],['dropped','Drop'],['open','Reopen']].map(([k,l])=>`<label><input type="radio" name="d-s" value="${k}" ${(cur.status||'')===k?'checked':''} required>${l}</label>`).join('')}</div></div>
      <div class="field"><label for="d-wording">Final wording</label><textarea id="d-wording" rows="2" placeholder="Leave blank to keep the current wording">${esc(cur.wording||'')}</textarea></div>
      <div class="field"><span class="flabel">Approved uses</span><span class="hint">${usesAgreed.length?'Pre-filled with the uses every compliance reviewer approved.':'No compliance review yet: only approve uses compliance has cleared.'}</span><div class="checks">${USES.map(([k,l])=>`<label><input type="checkbox" name="d-use" value="${k}" ${((cur.uses)||usesAgreed).includes(k)?'checked':''}>${l}</label>`).join('')}</div></div>
      <div class="field"><label for="d-note">Decision note</label><input type="text" id="d-note" value="${esc(cur.note||'')}" placeholder="Optional"></div>
      <div class="saveline"><button class="btn primary" type="submit">Record decision</button><span class="saved" id="dmsg"></span></div>
    </form></div>`;
}
function renderDetail(scrollTop){
  const el=document.getElementById('detail');
  if(!st.sel||!ITEM[st.sel]||ITEM[st.sel].type!==st.tab){ st.sel=(visible[0]||ITEMS.find(i=>i.type===st.tab)).id; }
  const it=ITEM[st.sel];
  el.innerHTML=`<div class="panel card" id="d-head"></div><div id="d-mine"></div><div id="d-others"></div><div id="d-dec"></div>`;
  renderHead(); renderMine(); renderOthers(); renderDecision();
  if(scrollTop && window.innerWidth<=980) el.scrollIntoView({block:'start'});
}
function renderHead(){
  const it=ITEM[st.sel], idx=visible.findIndex(v=>v.id===it.id), el=document.getElementById('d-head'); if(!el) return;
  el.innerHTML=`<div class="navrow"><span class="eyebrow">${it.type} · ${it.id}</span><span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${pill(statusOf(it.id))}<button class="btn" id="prev" ${idx<=0?'disabled':''} aria-label="Previous item">← Prev</button><button class="btn" id="next" ${idx<0||idx>=visible.length-1?'disabled':''} aria-label="Next item">Next →</button></span></div>
      <div class="stmt">${esc(it.text)}</div>${context(it)}`;
  document.getElementById('prev').onclick=()=>visible[idx-1]&&select(visible[idx-1].id);
  document.getElementById('next').onclick=()=>visible[idx+1]&&select(visible[idx+1].id);
}
function renderMine(){
  const it=ITEM[st.sel], el=document.getElementById('d-mine'); if(!el) return;
  el.innerHTML=myForm(it);
  const f=document.getElementById('rform');
  if(f){ f.onsubmit=e=>{e.preventDefault(); saveReview(false);}; document.getElementById('savenext').onclick=()=>saveReview(true);
    f.oninput=()=>{clearTimeout(f._t); f._t=setTimeout(()=>{try{localStorage.setItem(draftKey(it.id),JSON.stringify(readForm()));}catch(e){}},400);}; }
}
function renderOthers(){const el=document.getElementById('d-others'); if(!el) return; el.innerHTML=othersBlock(ITEM[st.sel]); fillNames();}
function renderDecision(){
  const el=document.getElementById('d-dec'); if(!el) return;
  if(el.contains(document.activeElement)&&document.activeElement.tagName!=='BUTTON') return;
  el.innerHTML=decisionBlock(ITEM[st.sel]);
  const df=document.getElementById('dform'); if(df) df.onsubmit=e=>{e.preventDefault(); saveDecision();};
  fillNames();
}
function renderLive(){renderTabs(); renderProgress(); renderList(); renderHead(); renderOthers(); renderDecision(); renderMe();
  const mine=document.getElementById('d-mine'); if(mine && !mine.contains(document.activeElement) && !document.getElementById('rform')) renderMine();}
function fillNames(){document.querySelectorAll('.nm[data-u]').forEach(n=>{const p=names[n.dataset.u]; n.textContent=(p&&p.name)||(p&&p.isMe?'You':'')||'A reviewer';});}
function readForm(){
  const f=document.getElementById('rform'); if(!f) return null;
  const v=f.querySelector('input[name="r-v"]:checked');
  const o={verdict:v?v.value:'', wording:f.querySelector('#r-wording').value.trim(), comment:f.querySelector('#r-comment').value.trim()};
  if(me.role==='business'){ const k=f.querySelector('input[name="r-keep"]:checked'); o.keep=k?k.value:'keep'; o.merge=f.querySelector('#r-merge').value.trim();
    if(f.querySelector('#r-step')){o.step=f.querySelector('#r-step').value; o.theme=f.querySelector('#r-theme').value;} }
  if(me.role==='compliance'){ o.flags=[...f.querySelectorAll('input[name="r-flag"]:checked')].map(x=>x.value); o.uses=[...f.querySelectorAll('input[name="r-use"]:checked')].map(x=>x.value); }
  return o;
}
let saving=false;
async function saveReview(next){
  if(saving||!db||!me.id||!me.role) return;
  const o=readForm(), msg=document.getElementById('formmsg');
  if(!o.verdict){msg.textContent='Choose a verdict first.';return;}
  if((o.verdict==='edits')&&!o.wording&&!o.comment){msg.textContent='Add the suggested wording or a comment for "Approve with edits".';return;}
  const id=st.sel; saving=true; msg.textContent='Saving…';
  const body={...o, role:me.role, item:id, type:ITEM[id].type, at:Date.now()};
  try{
    if(!reviewers[me.id]||reviewers[me.id].role!==me.role) await db.doc('rv/'+me.id).set({role:me.role, at:Date.now()});
    await db.collection('rv/'+me.id+'/items').doc(id).set(body);
    (reviews[id]=reviews[id]||{})[me.id]=body;
    try{localStorage.removeItem(draftKey(id));}catch(e){}
    toast(`Saved review of ${id}`);
    if(next){const i=visible.findIndex(v=>v.id===id); render(); if(visible[i+1]) select(visible[i+1].id);} else render();
  }catch(e){ msg.textContent=writeErr(e); if(e&&e.code==='invalid_argument'){me.canWrite=false; render();} }
  saving=false;
}
async function saveDecision(){
  const f=document.getElementById('dform'), msg=document.getElementById('dmsg'), id=st.sel;
  const s=f.querySelector('input[name="d-s"]:checked'); if(!s){msg.textContent='Choose a decision.';return;}
  const body={status:s.value, wording:f.querySelector('#d-wording').value.trim(), uses:[...f.querySelectorAll('input[name="d-use"]:checked')].map(x=>x.value), note:f.querySelector('#d-note').value.trim(), by:me.id, at:Date.now(), item:id};
  msg.textContent='Saving…';
  try{ if(body.status==='open') await db.doc('decisions/'+id).delete(); else await db.doc('decisions/'+id).set(body);
    if(body.status==='open') delete decisions[id]; else decisions[id]=body; toast(body.status==='open'?`Reopened ${id}`:`Recorded decision for ${id}`); render();
  }catch(e){ msg.textContent=writeErr(e); }
}
function writeErr(e){const c=e&&e.code; return c==='invalid_argument'?'You don\'t have permission to save this. Ask the owner for access.':c==='quota_exceeded'?'The review store is full. Ask the owner to export and clear old reviews.':c==='resource_exhausted'?'Too many saves at once. Wait a moment and try again.':'Couldn\'t save. Check your connection and try again.';}
async function setRole(r){
  if(!db||!me.id) return; me.role=r; renderMe(); render();
  try{ await db.doc('rv/'+me.id).set({role:r, at:Date.now()}); toast(`Reviewing as ${ROLES[r]}`);}catch(e){toast(writeErr(e));}
}

/* export */
async function exportCSV(){
  const rows=[['item_id','type','statement','job','theme','status','reviewer','role','verdict','suggested_wording','step','theme_suggested','keep','duplicate_of','flags','approved_uses','comment','reviewed_at','final_decision','final_wording','final_uses']];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const ids=Object.keys(reviewers).concat(Object.values(decisions).map(d=>d.by).filter(Boolean));
  try{names={...names,...await user.profiles([...new Set(ids)])};}catch(e){}
  ITEMS.forEach(i=>{const d=decisions[i.id]||{}; const rs=Object.entries(reviews[i.id]||{});
    const base=[i.id,i.type,i.text,i.job||'',i.theme||'',STATUSES.find(s=>s[0]===statusOf(i.id))[1]];
    const fin=[d.status||'',d.wording||'',(d.uses||[]).join('; ')];
    if(!rs.length) rows.push([...base,'','','','','','','','','','','','',...fin]);
    rs.forEach(([u,r])=>rows.push([...base,(names[u]&&names[u].name)||u,ROLES[r.role]||'',r.verdict,r.wording||'',r.step||'',r.theme||'',r.keep||'',r.merge||'',(r.flags||[]).join('; '),(r.uses||[]).join('; '),r.comment||'',r.at?new Date(r.at).toISOString():'',...fin]));});
  const csv=rows.map(r=>r.map(q).join(',')).join('\n');
  const dl=await RT().use('downloads');
  if(!dl){toast('Saving files isn\'t available in this view.');return;}
  try{await dl.save({filename:'PEO_Outcome_Review_'+new Date().toISOString().slice(0,10)+'.csv',data:csv});}
  catch(e){ if(e&&e.code!=='declined') toast(e.code==='rate_limited'?'A save is already open.':'Couldn\'t save the file.'); }
}

function render(){renderTabs(); renderProgress(); renderList(); renderDetail(false); renderMe();}

/* names: resolve every id on screen, cached by the platform */
async function refreshNames(){ if(!user) return; const ids=[...new Set(Object.keys(reviewers).concat(Object.values(decisions).map(d=>d.by).filter(Boolean)))]; if(!ids.length) return; try{names={...names,...await user.profiles(ids)}; fillNames(); renderOthersAvatars();}catch(e){} }
function renderOthersAvatars(){ renderOthers(); }
let rT; const soon=()=>{clearTimeout(rT); rT=setTimeout(()=>{renderLive(); refreshNames();},150);};

render();
(async()=>{
  const c=RT(); LOCAL=(c===window.KE_REVIEW_RUNTIME); if(!c||!c.use){ready=true; renderMe(); render(); return;}
  document.addEventListener('ke-review-store',()=>{renderMe(); renderProgress();});
  [db,user]=await Promise.all([c.use('db'),c.use('user')]);
  ready=true;
  if(user){const v=await user.me(); me.id=v.id; me.name=v.name; me.avatar=v.avatarUrl; me.canDecide=v.canEdit||v.isOwner; const w=await user.can('data.write'); if(w===false) me.canWrite=false;}
  if(!db){render(); return;}
  if(me.id){ try{const s=await db.doc('rv/'+me.id).get(); if(s.exists) me.role=s.data().role||null;}catch(e){} }
  render();
  db.collection('rv').onSnapshot(snap=>{
    snap.docs.forEach(d=>{ reviewers[d.id]=d.data();
      if(!subs[d.id] && Object.keys(subs).length<60){ const uid=d.id;
        subs[uid]=db.collection('rv/'+uid+'/items').onSnapshot(ss=>{
          Object.values(reviews).forEach(m=>{delete m[uid];});
          ss.docs.forEach(x=>{const r=x.data(); (reviews[x.id]=reviews[x.id]||{})[uid]=r;});
          soon();
        },()=>{});
      }});
    if(me.id&&reviewers[me.id]&&!me.role) me.role=reviewers[me.id].role;
    soon();
  },()=>{});
  db.collection('decisions').onSnapshot(snap=>{ Object.keys(decisions).forEach(k=>delete decisions[k]); snap.docs.forEach(d=>decisions[d.id]=d.data()); soon(); },()=>{});
})();
</script>
