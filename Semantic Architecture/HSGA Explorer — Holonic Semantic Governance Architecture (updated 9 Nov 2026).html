<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSGA Explorer — Holonic Semantic Governance Architecture</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#ffffff;--ink:#17202b;--ink2:#3c4756;--muted:#667383;--line:#d9dee5;--soft:#eef1f5;
  --accent:#2a6fdb;--accent-ink:#fff;
  --blue:#2a6fdb;--blue-bg:#e6effc;--teal:#0f8a7a;--teal-bg:#e2f5f2;--amber:#b97708;--amber-bg:#fdf1d8;
  --purple:#6a4bc4;--purple-bg:#eee9fb;--red:#c93c3c;--red-bg:#fbe7e7;--green:#2f8a3e;--green-bg:#e5f4e7;
  --coral:#c75a2c;--coral-bg:#fbebe3;--gray:#5b6572;--gray-bg:#eceff3;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141a;--surface:#171e26;--ink:#e8edf3;--ink2:#c3ccd6;--muted:#93a0ae;--line:#2b3541;--soft:#1e2630;
  --accent:#6fa3f5;--accent-ink:#0b1116;
  --blue:#6fa3f5;--blue-bg:#16243d;--teal:#3cc4b0;--teal-bg:#10302c;--amber:#e5ad3a;--amber-bg:#33290f;
  --purple:#a58ff0;--purple-bg:#261f42;--red:#ef7777;--red-bg:#3a1a1a;--green:#5cc66d;--green-bg:#142d19;
  --coral:#ef8f62;--coral-bg:#3a2216;--gray:#98a3b0;--gray-bg:#222830;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f141a;--surface:#171e26;--ink:#e8edf3;--ink2:#c3ccd6;--muted:#93a0ae;--line:#2b3541;--soft:#1e2630;
  --accent:#6fa3f5;--accent-ink:#0b1116;
  --blue:#6fa3f5;--blue-bg:#16243d;--teal:#3cc4b0;--teal-bg:#10302c;--amber:#e5ad3a;--amber-bg:#33290f;
  --purple:#a58ff0;--purple-bg:#261f42;--red:#ef7777;--red-bg:#3a1a1a;--green:#5cc66d;--green-bg:#142d19;
  --coral:#ef8f62;--coral-bg:#3a2216;--gray:#98a3b0;--gray-bg:#222830;color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0 0 12px}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand b{font-size:16px}
.brand span{font-size:12px;color:var(--muted)}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}

.shell{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1240px;margin:0 auto}
nav.side{position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);overflow:auto;padding:18px 12px;border-right:1px solid var(--line)}
nav.side .grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
nav.side a{display:flex;gap:8px;align-items:baseline;padding:7px 10px;border-radius:7px;color:var(--ink2);text-decoration:none;font-size:14px}
nav.side a i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);min-width:18px}
nav.side a:hover{background:var(--soft)}
nav.side a[aria-current="page"]{background:var(--blue-bg);color:var(--ink);font-weight:600}
main{padding:28px 32px 70px;min-width:0}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:2px;padding:8px}
  nav.side .grp{display:none}
  main{padding:20px 16px 60px}
}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
h1.page{font-size:30px;margin-bottom:10px}
.lede{font-size:17px;color:var(--ink2);max-width:68ch;margin-bottom:22px}
h2{font-size:19px;margin:30px 0 10px}
.prose{max-width:72ch;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:15px;font-weight:600;margin-top:2px}

figure{margin:0}
figcaption{font-size:13px;color:var(--muted);margin-top:8px;max-width:76ch}
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.diagram svg{display:block;width:100%;height:auto}
svg text{font-family:var(--font);fill:var(--ink)}
svg .nl{font-size:13.5px;font-weight:600;text-anchor:middle}
svg .ns{font-size:11px;text-anchor:middle;fill:var(--muted)}
svg .lab{font-size:11px;fill:var(--muted)}
svg .node{cursor:pointer}
svg .node rect,svg .node circle,svg .node path{stroke-width:1.4;transition:stroke-width .12s}
svg .node:hover rect,svg .node:hover circle{stroke-width:2.6}
svg .node.sel rect,svg .node.sel circle{stroke-width:3}
svg .c-blue{fill:var(--blue-bg);stroke:var(--blue)}svg .c-teal{fill:var(--teal-bg);stroke:var(--teal)}
svg .c-amber{fill:var(--amber-bg);stroke:var(--amber)}svg .c-purple{fill:var(--purple-bg);stroke:var(--purple)}
svg .c-red{fill:var(--red-bg);stroke:var(--red)}svg .c-green{fill:var(--green-bg);stroke:var(--green)}
svg .c-coral{fill:var(--coral-bg);stroke:var(--coral)}svg .c-gray{fill:var(--gray-bg);stroke:var(--gray)}
svg .edge{stroke:var(--muted);stroke-width:1.5;fill:none}
svg .edge.dash{stroke-dasharray:6 4}
svg .edge.dot{stroke-dasharray:2 4}
svg .edge.bad{stroke:var(--red)}

.detail{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:16px 18px;min-height:96px}
.detail h3{font-size:17px;margin-bottom:6px}
.detail .hint{color:var(--muted);font-size:14px}
.detail p{margin-bottom:8px;color:var(--ink2)}
.detail .lens{font-size:11px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block}
body[data-aud="biz"] .tech{display:none}
body[data-aud="tech"] .biz{display:none}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.links a{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:3px 11px;text-decoration:none}
.links a:hover{border-color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:12.5px}
pre.code{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;font:12.5px/1.6 var(--mono);color:var(--ink2);margin:8px 0}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cardbtn{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.cardbtn:hover{border-color:var(--accent)}
.cardbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--blue-bg)}
.cardbtn b{font-size:14px}
.cardbtn span{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);align-self:flex-start}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}
.pager a{border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);background:var(--surface);max-width:48%}
.pager a small{display:block;font-size:11px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em}
.pager a:hover{border-color:var(--accent)}
.calc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:end}
@media (max-width:760px){.calc{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.big{font-family:var(--mono);font-size:28px;font-weight:600}
.foot{margin-top:36px;font-size:12.5px;color:var(--muted);max-width:76ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.tblwrap{overflow-x:auto;margin:10px 0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
table.tbl th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--soft);padding:8px 12px;border-bottom:1px solid var(--line)}
table.tbl td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top;color:var(--ink2)}
table.tbl tr:first-child td{border-top:0}
table.tbl td:first-child{font-weight:600;color:var(--ink)}
.tool{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
ul.chk{list-style:none;margin:8px 0 0;padding:0}
ul.chk li{padding:3px 0 3px 22px;position:relative;font-size:13.5px;color:var(--ink2)}
ul.chk li:before{content:"";position:absolute;left:0;top:10px;width:10px;height:10px;border-radius:50%}
ul.chk li.g:before{background:var(--green)}ul.chk li.r:before{background:var(--red)}ul.chk li.n:before{background:var(--muted)}
ol.steps{margin:8px 0 0;padding-left:20px;color:var(--ink2);font-size:14px}ol.steps li{margin-bottom:4px}
.out{font-family:var(--mono);font-size:15px;font-weight:600;word-break:break-all;margin:6px 0 2px}
.banner{background:var(--amber-bg);border:1px solid var(--amber);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink);margin:0 0 16px}
.note{font-size:13px;color:var(--muted);margin:6px 0 0;max-width:76ch}
.sub{font-size:13.5px;color:var(--ink2);max-width:76ch;margin:0 0 10px}

.mxwrap{overflow-x:auto;margin:10px 0 0;padding-bottom:4px}
.mx{display:grid;gap:6px;min-width:760px}
.mxh{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 4px;align-self:end}
.mxr{display:flex;align-items:center;font-size:13px;font-weight:600;padding:6px 4px;color:var(--ink)}
.mxr small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
.mxc{color:var(--ink);font:inherit;font-size:12.5px;min-height:62px;justify-content:space-between}
.mxc b{font-size:12.5px;font-weight:600;color:var(--ink)}
.mxc.lv3{background:var(--blue-bg)}.mxc.lv2{background:var(--soft)}.mxc.lv1{background:var(--surface)}
.mxc[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:5px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
button.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 15px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
button.tab:hover{border-color:var(--accent)}
button.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cardbtn .tag.v5{border-color:var(--green);color:var(--green)}
.cardbtn .tag.pr{border-color:var(--amber);color:var(--amber)}
.stdgrid{grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
.stdgrid .cardbtn{padding:10px 12px}
.stdgrid .cardbtn b{font-size:13px}
.dots{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
</style>
</head>
<body data-aud="biz">
<header class="top">
  <div class="brand"><b>HSGA Explorer</b><span>Holonic Semantic Governance Architecture · scaffold, governance domains, standards, lexicon layer, tenancy and services · updated 9 Nov 2026</span></div>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="Audience lens">
    <button id="aud-biz" aria-pressed="true">Business view</button>
    <button id="aud-tech" aria-pressed="false">Technical view</button>
  </div>
  <button class="iconbtn" id="themebtn" aria-label="Toggle light and dark theme">Theme</button>
</header>
<div class="shell">
  <nav class="side" id="nav" aria-label="Walkthrough pages"></nav>
  <main id="main" tabindex="-1"></main>
</div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var DET={}; // diagram id -> detail map

/* ---------- svg helpers ---------- */
function N(id,x,y,w,h,label,sub,c){
  var cy=y+h/2, ly=sub?cy-3:cy+5, sy=cy+14;
  return '<g class="node" data-id="'+id+'" tabindex="0" role="button" aria-label="'+label+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="9" class="c-'+c+'"/>'+
    '<text class="nl" x="'+(x+w/2)+'" y="'+ly+'">'+label+'</text>'+(sub?'<text class="ns" x="'+(x+w/2)+'" y="'+sy+'">'+sub+'</text>':'')+'</g>';
}
function C(id,x,y,r,label,c,top){
  return '<g class="node" data-id="'+id+'" tabindex="0" role="button" aria-label="'+label+'"><circle cx="'+x+'" cy="'+y+'" r="'+r+'" class="c-'+c+'"/>'+
    '<text class="nl" x="'+x+'" y="'+(y+5)+'">'+top+'</text></g>'+
    '<text class="ns" x="'+x+'" y="'+(y+r+18)+'">'+label+'</text>';
}
function E(x1,y1,x2,y2,st){return '<line class="edge '+(st||'')+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" marker-end="url(#ar)"/>'}
function T(x,y,s,anchor){return '<text class="lab" x="'+x+'" y="'+y+'"'+(anchor?' text-anchor="'+anchor+'"':'')+'>'+s+'</text>'}
function svg(w,h,body,alt){
  return '<svg viewBox="0 0 '+w+' '+h+'" role="group" aria-label="'+alt+'"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker></defs>'+body+'</svg>';
}
function fig(id,svgHtml,caption,hint){
  return '<figure><div class="diagram" data-dia="'+id+'">'+svgHtml+'</div><div class="detail" data-panel="'+id+'" aria-live="polite"><div class="hint">'+(hint||'Select any cell in the diagram to see what it is and why it matters.')+'</div></div><figcaption>'+caption+'</figcaption></figure>';
}
function cardsFig(id,items,hint){
  var h='<div class="cards" data-dia="'+id+'">';
  items.forEach(function(it){h+='<button class="cardbtn node" data-id="'+it.id+'" aria-pressed="false"><b>'+it.t+'</b><span>'+it.s+'</span>'+(it.tag?'<span class="tag">'+it.tag+'</span>':'')+'</button>'});
  return h+'</div><div class="detail" data-panel="'+id+'" aria-live="polite" style="margin-top:12px"><div class="hint">'+(hint||'Select a card for the detail.')+'</div></div>';
}
function showDetail(dia,id){
  var d=(DET[dia]||{})[id]; var panel=document.querySelector('[data-panel="'+dia+'"]'); if(!d||!panel)return;
  var h='<h3>'+d.t+'</h3>';
  h+='<p class="biz"><span class="lens">Business view</span>'+d.biz+'</p>';
  h+='<p class="tech"><span class="lens">Technical view</span>'+d.tech+'</p>';
  if(d.code)h+='<pre class="code tech">'+d.code+'</pre>';
  if(d.links){h+='<div class="links">';d.links.forEach(function(l){h+='<a href="#'+l[1]+'">'+l[0]+' →</a>'});h+='</div>'}
  panel.innerHTML=h;
  var dg=document.querySelector('[data-dia="'+dia+'"]');
  dg.querySelectorAll('.node').forEach(function(n){var on=n.getAttribute('data-id')===id;n.classList.toggle('sel',on);if(n.tagName==='BUTTON')n.setAttribute('aria-pressed',on?'true':'false')});
}
document.addEventListener('click',function(e){
  var n=e.target.closest('.node');if(!n)return;var dg=n.closest('[data-dia]');if(!dg)return;
  showDetail(dg.getAttribute('data-dia'),n.getAttribute('data-id'));
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;var n=e.target.closest&&e.target.closest('g.node');if(!n)return;
  e.preventDefault();var dg=n.closest('[data-dia]');showDetail(dg.getAttribute('data-dia'),n.getAttribute('data-id'));
});

/* ---------- pages ---------- */
var PAGES=[];
function page(id,n,title,grp,render){PAGES.push({id:id,n:n,title:title,grp:grp,render:render})}
function head(eyebrow,title,lede){return '<div class="eyebrow">'+eyebrow+'</div><h1 class="page">'+title+'</h1><p class="lede">'+lede+'</p>'}


/* ---------- extra helpers ---------- */
function tbl(h,rows){var o='<div class="tblwrap"><table class="tbl"><thead><tr>';h.forEach(function(x){o+='<th scope="col">'+x+'</th>'});o+='</tr></thead><tbody>';rows.forEach(function(r){o+='<tr>';r.forEach(function(c){o+='<td>'+c+'</td>'});o+='</tr>'});return o+'</tbody></table></div>'}
function mk(dia,rows){DET[dia]=DET[dia]||{};rows.forEach(function(r){DET[dia][r[0]]={t:r[1],biz:r[2],tech:r[3],links:r[4]||[]}})}
/* card figure: rows = [id,title,short,tag,biz,tech,links] */
function cf(dia,rows,hint){mk(dia,rows.map(function(r){return [r[0],r[1],r[4],r[5],r[6]]}));return cardsFig(dia,rows.map(function(r){return {id:r[0],t:r[1],s:r[2],tag:r[3]}}),hint)}
/* horizontal chain of nodes: items = [id,label,sub,color] */
function chain(y,items,o){o=o||{};var w=o.w||900,pad=o.pad||8,gap=o.gap||26,h=o.h||64,n=items.length,nw=(w-2*pad-(n-1)*gap)/n,b='';
  items.forEach(function(it,i){var x=pad+i*(nw+gap);b+=N(it[0],x,y,nw,h,it[1],it[2],it[3]);if(i<n-1)b+=E(x+nw,y+h/2,x+nw+gap,y+h/2,o.dash?'dash':'')});return b}
/* dashed U-shaped return arrow under a chain, from node index a to node index b (b<a) */
function loopback(y,items,o,a,b,label){o=o||{};var w=o.w||900,pad=o.pad||8,gap=o.gap||26,h=o.h||64,n=items.length,nw=(w-2*pad-(n-1)*gap)/n;
  var xa=pad+a*(nw+gap)+nw/2,xb=pad+b*(nw+gap)+nw/2,y0=y+h,y1=y+h+26;
  return '<path class="edge dash" d="M'+xa+','+y0+' L'+xa+','+y1+' L'+xb+','+y1+' L'+xb+','+(y0+2)+'" marker-end="url(#ar)"/>'+T((xa+xb)/2,y1+14,label,'middle')}


/* 01 OVERVIEW */
page('overview','01','Overview','Orientation',function(){
  mk('ov',[
    ['legacy','Legacy and vendor systems','Payroll, HRIS, ERP, CRM, the warehouse and vendor tools keep doing what they do. HSGA does not ask you to replace or migrate them.','Treated as systems of record. Their schemas are bound to concepts by RDF anchors (dbt/LookML models, property-graph types, vector indices, catalog tables). No data movement is required for binding.',[['The scaffold','scaffold'],['Layers','holarchy']]],
    ['bind','Bind and map','Each system field is tied to one agreed business concept, so "customer" in one tool and "account holder" in another are known to be the same thing.','A mediation holon maintains the Mapping Graph with six correspondence types. Candidates are scored; low-confidence ones go to a steward (HITL) before promotion. Mapping is also an asset type with its own tier and naming rule.',[['Layers and mapping','holarchy'],['Naming standard','naming']]],
    ['core','Governed core and lexicons','One small, stable core of meaning. The many names that customers and roles use for it live beside it, scoped and traceable, so meaning cannot fragment and the core never has to grow with every customer.','BFO-rooted core vocabularies act as stem cells. Labels beyond a small vetted universal set, and concepts only one customer uses, live in scoped lexicon and customer-extension graphs that point at the core by IRI. Onboarding a customer adds no triples to core or domain graphs.',[['Semantic design','semantic'],['Lexicon layer','lexicon']]],

page('semantic','04','Semantic design','Architecture',function(){
  mk('sg',[
    ['bfo','BFO root','A neutral top-level framework of basic categories (things, processes, qualities). It gives every term a common ancestry.','Basic Formal Ontology (ISO/IEC 21838). All primitives must have BFO lineage; the derivation DAG is rooted here.',[]],
    ['core','Core vocabularies: the stem cells','A small set of foundational terms from which everything else is formed. Once published they are never edited, only deprecated and replaced. They carry meaning, not vocabulary variety.','Immutable and append-only. Deprecation requires supersededBy. Holds preferred labels, definitions, relations and a small vetted set of universal alternate labels. Core is the only place, besides top-level domains, where primitives may be minted. Core assets must not hold customer-specific or enterprise-specific content.',[['Naming standard','naming']]],
    ['da','Top-level domain','A business domain such as benefits. It can extend the core and, rarely, add a truly new primitive if it can show BFO lineage.','Derivation edges to core and/or parent domain; multi-parent permitted but kept low. Domain-minted primitives: minimal, BFO-rooted, top-level domains only. A domain asset should declare its parent core assets in its metadata; parentage is not encoded in the name.',[]],
    ['sub','Sub-domain','A narrower area inside a domain. It specializes what exists and never invents new foundations.','No primitive minting. Derives from the parent domain or core. An open question remains for nested area containers.',[['Open decisions','roadmap']]],
    ['db','Second top-level domain','A peer domain. Where its terms mean the same as another domain\'s, a lateral link records it.','Correspondence edges are lateral only and never replace derivation. The allowed-edge matrix is default-deny.',[]],
    ['ten','Customer extension vocabulary','A client organization\'s own concepts, kept in their own graph so they never clutter the shared core. A customer never gets an ontology.','Customer-tier vocabulary or taxonomy. Every extension concept has a derivation edge to a core or domain class; the match relation (exact, close, broad or narrow) is the lateral link. Tenants mint no primitives. A concept with several parents is one canonical concept with fully qualified terms for each extra parent context.',[['Lexicon layer','lexicon'],['Tenants and access','tenants']]],
    ['lex','Lexicons','Different roles, Insperity and each client can use their own words for the same concept. The meaning is not changed.','Label-only assets at domain, enterprise or customer tier. Label records point to concepts by IRI and never copy them (lexicalization edges). A lexicon declares in its catalog record the assets whose concepts it labels. A lexicon cannot add concepts.',[['Lexicon layer','lexicon']]],
    ['ten2','Tenant graph boundary','Each client has a separate graph. One client\'s extensions can never be seen by or affect another.','Per-tenant named graphs with no cross-tenant path. Isolation is enforced by the services, with the named graph as the unit of scope. Performance scales with tenant count rather than bloating core.',[['Tenants and access','tenants']]]
  ]);
  var b=N('bfo',320,8,260,44,'BFO root','foundational categories','gray')+
   N('core',320,86,260,52,'Core vocabularies','stem cells, immutable','blue')+

  mk('inv',[

   ['i2','Primitives are rare and rooted','New foundational ideas are exceptional, and must be tied to the BFO foundation.','Minted only at core or top-level domain; BFO lineage required; minimal. Tracked as domain-minted primitive share.'],
   ['i3','Rooted acyclic derivation DAG','Every term can be traced upward to the foundation, with no loops.','Multi-parent (polymorphic) inheritance allowed, kept limited; reported when a concept has more than two parents.'],
   ['i4','Three edge types, default deny','Only a few kinds of relationship are allowed, which keeps the web of terms from turning into an unusable tangle.','Derivation, correspondence, lexicalization. An allowed-edge matrix by graph pair is default-deny, avoiding a fully meshed everything-relates-to-everything graph.'],
   ['i5','Core holds meaning; lexicons hold names','The core carries preferred labels and definitions. Everything else customers and roles call a concept lives in a lexicon, so onboarding a customer adds nothing to the core.','Core and domain terms keep only the vetted universal alternate-label set. Labels valid for the enterprise or for one tenant live in lexicons. A label is a record with scope, type, language, evidence, status, reviewer and dates. Unresolved labels are routed to HITL.'],
   ['i6','Three orphan checks','Nothing floats free: every term, field and label connects back to the foundation.','(1) concept has a derivation path to BFO; (2) schema binding coverage; (3) label resolution. Run per graph, per release, including each tenant graph.'],
   ['i7','Five asset types, no modules','Everything governed is a vocabulary, a taxonomy, an ontology, a lexicon or a mapping. Nothing else.','Lexicon holds labels only; mapping holds match relations between assets. The word module is not used. Each type needs its own metadata header, and the single-letter codes can take L for lexicon and M for mapping.'],

    ['Enterprise','vocabulary, taxonomy, lexicon, mapping','House terms valid for every tenant'],

  '<div class="links"><a href="#naming">Graph naming standard →</a><a href="#lexicon">Lexicon layer →</a></div>'+
  '<h2>Relation to multilayer and hetero-functional graph theory</h2><p class="prose">The structure behaves like a controlled hybrid: domain decomposition and propagation resemble a multilayer network with diagonal (categorical) coupling by ID, while the process-centred unifying domain echoes hetero-functional graphs. The design deliberately supports only a narrow slice of the general multilayer spectrum, because full generality would allow everything to relate to everything.</p>';

    '<text class="lab" x="8" y="186">Support: who runs it, how it is bound, what is measured</text>'+

/* ---------- router ---------- */
function buildNav(cur){
  var h='',last='';
  PAGES.forEach(function(p){
    if(p.grp!==last){h+='<div class="grp">'+p.grp+'</div>';last=p.grp}
    h+='<a href="#'+p.id+'"'+(p.id===cur?' aria-current="page"':'')+'><i>'+p.n+'</i>'+p.title+'</a>';
  });
  $('#nav').innerHTML=h;
}
function route(){
  var id=(location.hash||'#overview').slice(1);
  var i=PAGES.findIndex(function(p){return p.id===id});if(i<0){i=0}
  var p=PAGES[i];DET={};
  buildNav(p.id);
  var html=p.render();
  var prev=PAGES[i-1],next=PAGES[i+1];
  html+='<div class="pager">'+(prev?'<a href="#'+prev.id+'"><small>Previous</small>'+prev.title+'</a>':'<span></span>')+(next?'<a href="#'+next.id+'" style="text-align:right"><small>Next</small>'+next.title+'</a>':'<span></span>')+'</div>';
  $('#main').innerHTML=html;
  document.title=p.title+' · HSGA Explorer';
  window.scrollTo(0,0);
  if(p.id==='measure')wireCalc();
  if(p.id==='lexicon')wireRes();
  if(p.id==='naming')wireName();
  if(p.id==='domaindive')wireDive();
  if(p.id==='standards')wireStd();
}
function wireCalc(){
  var oh=$('#oh'),nh=$('#nh');
  function u(){
    $('#ot').textContent=oh.value;$('#nt').textContent=nh.value;
    var n=+nh.value,t=+oh.value;
    $('#mt').textContent=n===0?'> '+t+' h':Math.round(t/n)+' h';
  }
  oh.addEventListener('input',u);nh.addEventListener('input',u);u();
}
window.addEventListener('hashchange',route);

function setAud(a){
  document.body.setAttribute('data-aud',a);
  $('#aud-biz').setAttribute('aria-pressed',a==='biz'?'true':'false');
  $('#aud-tech').setAttribute('aria-pressed',a==='tech'?'true':'false');
}
$('#aud-biz').addEventListener('click',function(){setAud('biz')});
$('#aud-tech').addEventListener('click',function(){setAud('tech')});
$('#themebtn').addEventListener('click',function(){
  var r=document.documentElement,cur=r.getAttribute('data-theme');
  if(!cur){cur=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
  r.setAttribute('data-theme',cur==='dark'?'light':'dark');
});
route();
